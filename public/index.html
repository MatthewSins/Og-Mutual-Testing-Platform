<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Free Mutual Beta Testing</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #475569; }
        #status { font-weight: bold; margin: 10px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>OG Tester Companion</h2>
        <p>Enter the package name of the app you are testing:</p>
        <input type="text" id="packageName" placeholder="e.g., com.example.myapp">
        <button id="verifyBtn" onclick="triggerAndroidVerification()">Verify 1 Minute Playtime</button>
        <div id="status">Ready</div>
    </div>

    <div id="feedbackSection" class="card hidden">
        <h3>🎉 Verification Success!</h3>
        <p>Submit your first impression or bug report to claim your Karma point:</p>
        <textarea id="bugFeedback" rows="4" placeholder="What issues or bugs did you encounter? Minimum 10 characters..."></textarea>
        <button id="submitBtn" onclick="submitLogToSupabase()">Submit Feedback & Earn Karma</button>
    </div>

    <script>
        // Initialize Supabase (Vercel will inject these from Environment Variables)
        const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co"; 
        const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let verifiedDuration = 0;
        let resolvedAppUuid = "";
        
        // Mocked or dynamically set from your app login session
        let currentTesterUuid = "PASTE_A_VALID_USER_UUID_FROM_SUPABASE_AUTH";

        // 1. Tells the Native Android wrapper to look up foreground time
        function triggerAndroidVerification() {
            const pkg = document.getElementById('packageName').value.trim();
            if (!pkg) { alert("Please enter a package name."); return; }
            
            document.getElementById('status').innerText = "Checking system usage records...";
            
            if (window.AndroidBridge) {
                // Invokes the native Kotlin hardware hook
                window.AndroidBridge.verifyAppUsage(pkg);
            } else {
                document.getElementById('status').innerText = "Error: Open this page inside the OG Companion APK to track time.";
                document.getElementById('status').style.color = "#ef4444";
            }
        }

        // 2. The Kotlin Android app executes this callback if validation PASSES
        function onValidationSuccess(packageName, durationSeconds, appUuid) {
            verifiedDuration = durationSeconds;
            resolvedAppUuid = appUuid;
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `Successfully verified! Used for ${durationSeconds} seconds today.`;
            statusDiv.style.color = "#22c55e";
            
            document.getElementById('feedbackSection').classList.remove('hidden');
            document.getElementById('verifyBtn').disabled = true;
        }

        // 3. The Kotlin Android app executes this callback if validation FAILS
        function onValidationFailed(remainingSeconds) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `Validation Failed. You need to keep the app open for ${remainingSeconds} more seconds.`;
            statusDiv.style.color = "#ef4444";
        }

        // 4. Submits the transaction directly to your active Supabase setup
        async function submitLogToSupabase() {
            const feedback = document.getElementById('bugFeedback').value.trim();
            if (feedback.length < 10) { alert("Please provide a bit more detailed feedback for the developer."); return; }
            
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').innerText = "Uploading data...";

            const { data, error } = await supabase
                .from('daily_progress_logs')
                .insert([
                    { 
                        tester_id: currentTesterUuid, 
                        app_id: resolvedAppUuid, 
                        duration_seconds: parseInt(verifiedDuration),
                        bug_feedback: feedback 
                    }
                ]);

            if (error) {
                alert("Upload failed: " + error.message);
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').innerText = "Submit Feedback & Earn Karma";
            } else {
                alert("Karma Point safely added to your balance!");
                location.reload(); // Reset screen for next test execution
            }
        }
    </script>
</body>
</html>
