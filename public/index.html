<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Tester Companion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-preset-stars@2/tsparticles.preset.stars.bundle.min.js"></script>
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            margin: 0; 
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #000000; /* Deep black space base */
            color: var(--text-main); 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* The particle canvas layer */
        #tsparticles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Glassmorphism Container */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 500px;
            padding: 32px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 { margin-top: 0; font-weight: 600; letter-spacing: -0.5px; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px; }

        input, textarea { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0 16px 0; 
            border-radius: 10px; 
            border: 1px solid var(--glass-border); 
            background: rgba(0, 0, 0, 0.2); 
            color: white; 
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.4);
        }

        button { 
            width: 100%; 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 1rem;
            cursor: pointer; 
            transition: background 0.3s ease, transform 0.1s ease;
        }

        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

        #status { font-weight: 500; margin-top: 16px; font-size: 0.9rem; min-height: 20px;}
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="tsparticles"></div>

    <div class="container">
        <div id="verifySection">
            <h2>OG Tester Companion</h2>
            <p>Enter the package name to verify your testing session.</p>
            <input type="text" id="packageName" placeholder="e.g., com.example.myapp">
            <button id="verifyBtn" onclick="triggerAndroidVerification()">Verify 1 Minute Playtime</button>
            <div id="status"></div>
        </div>

        <div id="feedbackSection" class="hidden">
            <h2>🎉 Verification Success</h2>
            <p>Submit your bug report to claim your Karma point.</p>
            <textarea id="bugFeedback" rows="4" placeholder="Detail the issues or UI bugs you encountered..."></textarea>
            <button id="submitBtn" onclick="submitLogToSupabase()">Submit & Earn Karma</button>
        </div>
    </div>

    <script>
        // Initialize realistic space particles
        tsParticles.loadPreset("tsparticles", "stars").then(() => {
            console.log("Particles loaded");
        });

        // Supabase Init (Replace with your actual keys!)
        const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co"; 
        const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let verifiedDuration = 0;
        let resolvedAppUuid = "";
        let currentTesterUuid = "PASTE_A_VALID_USER_UUID_FROM_SUPABASE_AUTH";

        function triggerAndroidVerification() {
            const pkg = document.getElementById('packageName').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (!pkg) { 
                statusDiv.innerText = "Please enter a package name."; 
                statusDiv.style.color = "#fbbf24";
                return; 
            }
            
            statusDiv.innerText = "Scanning system usage records...";
            statusDiv.style.color = var(--text-muted);
            
            if (window.AndroidBridge) {
                window.AndroidBridge.verifyAppUsage(pkg);
            } else {
                statusDiv.innerText = "Hardware connection missing. Open inside the OG APK.";
                statusDiv.style.color = "#ef4444";
            }
        }

        function onValidationSuccess(packageName, durationSeconds, appUuid) {
            verifiedDuration = durationSeconds;
            resolvedAppUuid = appUuid;
            
            document.getElementById('verifySection').classList.add('hidden');
            document.getElementById('feedbackSection').classList.remove('hidden');
        }

        function onValidationFailed(remainingSeconds) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = `Keep the app open for ${remainingSeconds} more seconds.`;
            statusDiv.style.color = "#ef4444";
        }

        async function submitLogToSupabase() {
            const feedback = document.getElementById('bugFeedback').value.trim();
            if (feedback.length < 10) { alert("Please provide detailed feedback."); return; }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Encrypting and Uploading...";

            const { data, error } = await supabase
                .from('daily_progress_logs')
                .insert([{ 
                    tester_id: currentTesterUuid, 
                    app_id: resolvedAppUuid, 
                    duration_seconds: parseInt(verifiedDuration),
                    bug_feedback: feedback 
                }]);

            if (error) {
                alert("Upload failed: " + error.message);
                btn.disabled = false;
                btn.innerText = "Submit & Earn Karma";
            } else {
                alert("Karma Point safely added to your balance!");
                location.reload(); 
            }
        }
    </script>
</body>
</html>
