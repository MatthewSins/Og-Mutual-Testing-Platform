<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Mutual Testing Network</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-preset-stars@2/tsparticles.preset.stars.bundle.min.js"></script>
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6; --accent-hover: #2563eb;
            --success: #10b981; --danger: #ef4444;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --nav-height: 70px;
        }

        body { 
            margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #000000; color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        #tsparticles { position: absolute; width: 100%; height: 100%; z-index: -1; }

        /* Auth Overlay */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-bottom: 16px;
            width: 90%; max-width: 400px; margin-left: auto; margin-right: auto;
        }

        header { padding: 20px; text-align: center; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--glass-border); z-index: 10; }
        header h1 { margin: 0; font-size: 1.2rem; }
        .stats-row { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
        .badge { padding: 4px 12px; background: rgba(59,130,246,0.2); border: 1px solid var(--accent); border-radius: 20px; font-size: 0.85rem; color: #60a5fa; }

        main { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: calc(var(--nav-height) + 20px); z-index: 1; }
        
        .app-item { display: flex; justify-content: space-between; align-items: center; }
        .app-info h3 { margin: 0 0 4px 0; font-size: 1.1rem; }
        .app-info p { margin: 0; color: var(--text-muted); font-size: 0.85rem; }
        
        button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; margin-bottom: 10px;}
        button:hover { background: var(--accent-hover); }
        .btn-test { background: var(--success); width: auto; margin:0;}
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }

        input { width: 100%; padding: 14px; margin: 8px 0 16px 0; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; }
        input:focus { outline: none; border-color: var(--accent); }

        nav {
            position: fixed; bottom: 0; width: 100%; height: var(--nav-height); background: rgba(10,10,10,0.8);
            border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; z-index: 10;
        }
        .nav-item { color: var(--text-muted); font-size: 0.85rem; text-align: center; cursor: pointer; padding: 10px; flex: 1; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
        
        .view { display: none; }
        .view.active { display: block; }
        .warning-box { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); padding: 12px; border-radius: 8px; font-size: 0.9rem; color: #fca5a5; margin-bottom: 15px;}
    </style>
</head>
<body>

    <div id="tsparticles"></div>

    <div id="authOverlay">
        <div class="glass-card">
            <h2 id="authTitle" style="text-align:center; margin-top:0;">Login</h2>
            <p id="authError" style="color:var(--danger); font-size:0.85rem; text-align:center;"></p>
            
            <input type="email" id="authEmail" placeholder="Developer Email">
            <input type="password" id="authPassword" placeholder="Password (Min 6 chars)">
            
            <button id="mainAuthBtn" onclick="handleAuth()">Sign In</button>
            <button class="btn-outline" onclick="toggleAuthMode()" id="switchAuthBtn">Need an account? Sign up</button>
        </div>
    </div>

    <div id="mainApp" style="display:none; height:100%; flex-direction:column;">
        <header>
            <h1>OG BETA TESTERS v2</h1>
            <div class="stats-row">
                <div class="badge">Karma: <span id="uiKarma">0</span></div>
                <div class="badge" style="border-color:var(--success); color:var(--success);">Tests: <span id="uiTests">0</span>/3</div>
            </div>
        </header>

        <main>
            <div id="view-community" class="view active">
                <h2 style="margin-top:0;">Community Apps</h2>
                <div id="appListContainer">
                    <div class="glass-card" style="text-align: center; color: var(--text-muted);">Loading pool...</div>
                </div>
            </div>

            <div id="view-verify" class="view">
                <div class="glass-card" style="text-align: center;">
                    <h2>Verify Test</h2>
                    <input type="text" id="verifyPackageName" placeholder="e.g., com.example.myapp">
                    <button onclick="triggerAndroidVerification()">Verify 1 Minute Playtime</button>
                    <div id="status" style="margin-top: 15px;"></div>
                </div>
                
                <div id="feedbackSection" class="glass-card" style="display:none; border-color:var(--success); text-align:center;">
                    <h2>🎉 Verified!</h2>
                    <button onclick="rewardUser()" style="background:var(--success);">Claim +1 Karma & Test Count</button>
                </div>
            </div>

            <div id="view-submit" class="view">
                <div class="glass-card">
                    <h2 style="margin-top:0;">Submit Your App</h2>
                    <div id="submitRequirementGate" class="warning-box hidden">
                        ⚠️ You must complete at least 3 tests before you can submit your own app to the network.
                    </div>
                    
                    <label>Professional App Name</label>
                    <input type="text" id="newAppName" placeholder="Space Invaders Pro">
                    
                    <label>Package Name</label>
                    <input type="text" id="newAppPackage" placeholder="com.company.game">
                    
                    <label>Google Play Link</label>
                    <input type="url" id="newAppUrl" placeholder="https://play.google.com/...">
                    
                    <button id="submitAppBtn" onclick="submitNewApp()">Spend 20 Karma & Publish</button>
                </div>
            </div>
        </main>

        <nav>
            <div class="nav-item active" onclick="switchTab('community')"><span class="nav-icon">📱</span>Feed</div>
            <div class="nav-item" onclick="switchTab('verify')"><span class="nav-icon">✅</span>Verify</div>
            <div class="nav-item" onclick="switchTab('submit')"><span class="nav-icon">➕</span>My App</div>
        </nav>
    </div>

    <script>
        tsParticles.loadPreset("tsparticles", "stars");

        // --- 1. SUPABASE SETUP ---
        const SUPABASE_URL = "https://aqdunqacywekbajxxiqc.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxZHVucWFjeXdla2Jhanh4aXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxOTc0NTMsImV4cCI6MjA5Nzc3MzQ1M30.hUMMoK7sBidrY1hXcWWSRIWqAviNEC5h7slf875BCr0";
        
        // FIX: We rename our connection to 'supabaseClient' so it doesn't fight the CDN
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 2. GLOBAL VARIABLES ---
        let isLoginMode = true;
        let currentUser = null;
        let userData = { tests_completed: 0, karma: 0 }; 

        // --- 3. AUTHENTICATION LOGIC ---
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "Login" : "Create Account";
            document.getElementById('mainAuthBtn').innerText = isLoginMode ? "Sign In" : "Sign Up";
            document.getElementById('switchAuthBtn').innerText = isLoginMode ? "Need an account? Sign up" : "Already have an account? Login";
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const errDiv = document.getElementById('authError');
            const btn = document.getElementById('mainAuthBtn');
            
            errDiv.style.color = "var(--danger)";

            if(!email || password.length < 6) { 
                errDiv.innerText = "Valid email and 6+ char password required."; 
                return; 
            }
            
            btn.innerText = "Processing...";
            errDiv.innerText = ""; 

            try {
                let authResponse;

                if (isLoginMode) {
                    authResponse = await supabaseClient.auth.signInWithPassword({ email, password });
                } else {
                    authResponse = await supabaseClient.auth.signUp({ email, password });
                }

                if (authResponse.error) {
                    errDiv.innerText = authResponse.error.message;
                    btn.innerText = isLoginMode ? "Sign In" : "Sign Up";
                } else if (!isLoginMode && !authResponse.data.session) {
                    errDiv.innerText = "Success! Please check your email inbox to verify your account.";
                    errDiv.style.color = "var(--success)";
                    btn.innerText = "Sign Up";
                }
            } catch (err) {
                errDiv.innerText = "Network Error. Check your Supabase keys.";
                btn.innerText = isLoginMode ? "Sign In" : "Sign Up";
            }
        }

        // --- 4. SESSION LISTENER ---
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                currentUser = session.user;
                
                // Fetch stats from free_users table
                const { data } = await supabaseClient.from('free_users').select('tests_completed').eq('id', currentUser.id).single();
                
                if (data) {
                    userData.tests_completed = data.tests_completed || 0;
                    updateUIStats();
                }

                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                loadCommunityApps();
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        function updateUIStats() {
            document.getElementById('uiTests').innerText = userData.tests_completed;
            
            if (userData.tests_completed < 3) {
                document.getElementById('submitRequirementGate').style.display = 'block';
                document.getElementById('submitAppBtn').disabled = true;
                document.getElementById('submitAppBtn').style.background = '#334155';
            } else {
                document.getElementById('submitRequirementGate').style.display = 'none';
                document.getElementById('submitAppBtn').disabled = false;
                document.getElementById('submitAppBtn').style.background = 'var(--accent)';
            }
        }

        // --- 5. UI NAVIGATION ---
        function switchTab(tabId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // --- 6. DATABASE READ/WRITE ---
        async function loadCommunityApps() {
            const { data: apps, error } = await supabaseClient.from('community_apps').select('*').eq('status', 'active');
            const container = document.getElementById('appListContainer');
            
            if (error) {
                container.innerHTML = `<div class="glass-card"><p style="color:var(--danger)">Error: ${error.message}</p></div>`;
                return;
            }

            if (!apps || apps.length === 0) { 
                container.innerHTML = `<div class="glass-card" style="text-align:center"><p>No apps right now. Check back soon!</p></div>`; 
                return; 
            }
            
            container.innerHTML = ''; 
            apps.forEach(app => {
                container.innerHTML += `
                    <div class="glass-card app-item">
                        <div class="app-info">
                            <h3>${app.app_name}</h3>
                            <p>${app.package_name}</p>
                        </div>
                        <button class="btn-test" onclick="startTest('${app.package_name}', '${app.play_store_link}')">Test</button>
                    </div>`;
            });
        }

        function startTest(packageName, url) {
            window.open(url, '_blank');
            document.getElementById('verifyPackageName').value = packageName;
            switchTab('verify');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.nav-item')[1].classList.add('active'); 
        }

        async function submitNewApp() {
            if (userData.tests_completed < 3) return; 

            const name = document.getElementById('newAppName').value.trim();
            const pkg = document.getElementById('newAppPackage').value.trim();
            const url = document.getElementById('newAppUrl').value.trim();
            const btn = document.getElementById('submitAppBtn');

            if(!name || !pkg || !url) { alert("Fill all fields."); return; }

            btn.innerText = "Publishing...";
            btn.disabled = true;

            const { error } = await supabaseClient.from('community_apps').insert([{ 
                owner_id: currentUser.id,
                app_name: name,
                package_name: pkg,
                play_store_link: url
            }]);

            if (error) { 
                alert("Failed: " + error.message); 
                btn.innerText = "Spend 20 Karma & Publish";
                btn.disabled = false;
            } else {
                alert("App Published Successfully!");
                document.getElementById('newAppName').value = '';
                document.getElementById('newAppPackage').value = '';
                document.getElementById('newAppUrl').value = '';
                btn.innerText = "Spend 20 Karma & Publish";
                btn.disabled = false;
                
                loadCommunityApps();
                document.querySelectorAll('.nav-item')[0].click();
            }
        }

        // --- 7. HARDWARE VERIFICATION ---
        function triggerAndroidVerification() {
            const pkg = document.getElementById('verifyPackageName').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (!pkg) { statusDiv.innerText = "Please enter a package name."; return; }
            
            statusDiv.innerText = "Scanning device usage records...";
            statusDiv.style.color = "var(--accent)";
            
            if (window.AndroidBridge) {
                window.AndroidBridge.verifyAppUsage(pkg);
            } else {
                statusDiv.innerText = "TESTING MODE: Hardware bypassed in browser.";
                setTimeout(() => { 
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('feedbackSection').style.display = 'block';
                }, 1500);
            }
        }

        async function rewardUser() {
            alert("Reward logic will go here! Returning to feed.");
            document.getElementById('feedbackSection').style.display = 'none';
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').innerText = "";
            document.querySelectorAll('.nav-item')[0].click();
        }
    </script>
</body>
</html>
